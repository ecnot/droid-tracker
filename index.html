 else if(d.scale)S.scale=Math.min(1.5,Math.max(.8,Math.round(((S.scale||1)+.1*+d.scale)*10)/10));
 else if(d.t!==undefined){const n=d.n,t=+d.t;P().own[n]=own(n)===t?t-1:t}
 else if(d.go){P().cur++;window.scrollTo({top:0,behavior:"smooth"})}
 else if(d.s)P().cur+=+d.s;
 else if(d.v)S.tab=d.v;
 else if(d.more)S.more=!S.more;
 else if(b.id==="reset"){if(S.arm!=="reset"){S.arm="reset";render();return}S.arm=null;S.p[S.path]={cur:0,own:{},sold:{}}}
 else return;
 save();render();
});
document.addEventListener("change",e=>{
 if(e.target.id==="jump"){P().cur=+e.target.value}
 else if(e.target.id==="path"){S.path=e.target.value;load()}
 else return;
 save();render();
});
document.getElementById("q").oninput=render;
S.arm=null;S.open=null;S.rar=S.rar||{};load();render();
</script>
